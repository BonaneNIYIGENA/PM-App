<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>taskMS app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB13D"/>
      <stop offset="1" stop-color="#F25C05"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Cuts a gap in the box where the tick passes through it -->
    <mask id="gap">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M296 256 L392 142" fill="none" stroke="#000"
            stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <rect x="114" y="140" width="240" height="240" rx="52" fill="none"
        stroke="#fff" stroke-width="30" mask="url(#gap)"/>
  <path d="M166 270 L230 334 L392 142" fill="none" stroke="#fff"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
